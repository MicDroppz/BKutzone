<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Space Canvas FX -->
  <div class="stars-bg"></div>

  <!-- Header / Navigation -->
  <header class="header-bar">
    <div class="container nav-wrapper">
      <a href="#hero" class="brand-logo">
        <span class="logo-icon">⚡</span>
        <span id="site-title"></span>
      </a>
      <nav class="nav-links">
        <a href="#hero" id="nav-home"></a>
        <a href="#catalog" class="category-link" data-category="tools" id="nav-tools"></a>
        <a href="#catalog" class="category-link" data-category="attire" id="nav-attire"></a>
      </nav>
      <button class="cart-trigger" id="cart-toggle-btn">
        <span id="nav-cart"></span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="hero-section">
    <div class="container hero-content">
      <div class="hero-badge">SPACE AGE BARBER GEAR</div>
      <h1 id="hero-headline"></h1>
      <p id="hero-subtext"></p>
      <div class="hero-actions">
        <a href="#catalog" class="btn btn-primary" id="hero-cta-btn"></a>
      </div>
    </div>
  </section>

  <!-- Store Main / Catalog Section -->
  <main id="catalog" class="container main-content">
    <div class="catalog-controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search cyber tools & attire...">
      </div>
      <div class="filter-buttons" id="category-filters">
        <!-- Category Filter Buttons Rendered via JavaScript -->
      </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="product-grid">
      <!-- Cards Rendered via JavaScript -->
    </div>
  </main>

  <!-- Shopping Cart Modal Sidebar -->
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2>Cargo Bay Cart</h2>
      <button class="close-btn" id="cart-close-btn">&times;</button>
    </div>
    <div class="cart-body" id="cart-items-container">
      <!-- Cart Items Rendered via JavaScript -->
    </div>
    <div class="cart-footer">
      <div class="cart-summary">
        <span>Total Payload:</span>
        <strong id="cart-total">$0.00</strong>
      </div>
      <button class="btn btn-primary btn-block" id="checkout-btn">Initiate Hyper-Checkout</button>
    </div>
  </aside>
  <div class="cart-overlay" id="cart-overlay"></div>

  <!-- Footer -->
  <footer class="footer-bar">
    <div class="container footer-content">
      <p id="site-tagline"></p>
      <p id="footer-text"></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
